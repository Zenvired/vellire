name: Build Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download v0.1.5 --dir release \
            --pattern vellire_0.1.5_amd64.deb --pattern SHA256SUMS-0.1.5
          cd release
          sha256sum --check --ignore-missing SHA256SUMS-0.1.5
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: vellire-snap-amd64
          path: ${{ steps.build.outputs.snap }}
