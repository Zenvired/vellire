name: Build Snap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Linux release
        run: |
          mkdir -p release
          cd release
          base=https://raw.githubusercontent.com/${{ github.repository }}/v0.1.5-packages/packages
          curl --fail --location --retry 3 -O "$base/vellire_0.1.5_amd64.deb"
          curl --fail --location --retry 3 -O "$base/SHA256SUMS-0.1.5"
          sha256sum --check --ignore-missing SHA256SUMS-0.1.5
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: vellire-snap-amd64
          path: ${{ steps.build.outputs.snap }}
