name: vellire
base: core24
version: '0.1.5'
summary: Live Unicode typing styles
description: |
  Preview and apply Unicode text styles such as Bold, Italic and Monospace.
  Vellire can style text as you type in compatible apps through IBus.
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  vellire:
    command: usr/bin/vellire
    extensions: [gnome]
    plugs: [desktop-legacy, network, network-bind, audio-playback]
    environment:
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0
      PYTHONHOME: $SNAP/usr
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages

parts:
  vellire:
    plugin: nil
    source: release
    stage-packages:
      - gir1.2-ibus-1.0
      - libayatana-appindicator3-1
      - libwebkit2gtk-4.1-0
      - python3
      - python3-gi
      - xdg-utils
    override-build: |
      dpkg-deb -x vellire_0.1.5_amd64.deb "$CRAFT_PART_INSTALL"
      install -d "$CRAFT_PART_INSTALL/meta/gui"
      desktop="$CRAFT_PART_INSTALL/usr/share/applications/io.vellire.desktop.desktop"
      sed -e '/^NoDisplay=/d' -e 's|^Icon=.*|Icon=${SNAP}/meta/gui/vellire.png|' \
        "$desktop" > "$CRAFT_PART_INSTALL/meta/gui/vellire.desktop"
      install -m644 "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/io.vellire.desktop.png" \
        "$CRAFT_PART_INSTALL/meta/gui/vellire.png"
      rm -rf "$CRAFT_PART_INSTALL/usr/share/ibus"
